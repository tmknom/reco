version: 2

# project_name は、次の箇所と同じ値にする。変えるときは同時に変える。
#   - .github/workflows/release.yml の APP_NAME
project_name: reco

builds:
  - id: cli
    main: .
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # 動作する CPU の下限を決める GOAMD64 と GOARM64 は、GoReleaser がターゲットごとにこの値で設定する。既定値と同じ値を明示する
    goamd64:
      - v1
    goarm64:
      - v8.0
    # GoReleaser は runner の環境変数（go env -w の設定ファイルも含む）を引き継ぐため、
    # ビルドに関わる変数は既定値でも明示し、その値が runner の設定に左右されないようにする。
    # GOFLAGS は空にし、ビルドのフラグは flags だけで決める。
    # 依存モジュールの完全性は go.sum との照合が保証し、-mod=readonly により go.sum にないモジュールはビルドを止める。
    # GOPROXY 以下は、取得元を公開のプロキシとチェックサム DB に揃え、プロキシにないモジュールを VCS から直接取得しないようにする。
    # 変えるときは、release.yml の test ジョブの env も同時に変える
    env:
      - CGO_ENABLED=0
      - GOTOOLCHAIN=local
      - GOFLAGS=
      - GOEXPERIMENT=
      - GOFIPS140=off
      - GOPROXY=https://proxy.golang.org
      - GOSUMDB=sum.golang.org
      - GOPRIVATE=
      - GONOPROXY=
      - GONOSUMDB=
      - GOINSECURE=
    flags:
      - -trimpath
      - -mod=readonly
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# 利用者がダウンロードしたバイナリを展開せずに実行できるよう、アーカイブにせずそのまま配布する。
# HTTP でダウンロードしたファイルには実行権限が付かないため、Linux と macOS では利用者が chmod +x を実行する。
# binary 形式では、バイナリは dist/ 直下にコピーされず、ビルド先のパスのまま name_template の名前（Windows では .exe 付き）を与えられる。
# そのため release.yml の build ジョブは、dist/artifacts.json から名前とパスの対応を読んでバイナリを集める
archives:
  - id: binaries
    formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# 配布するバイナリごとに <配布名>.sbom.json を生成する。sbom は checksum より先に動くため、SBOM も SHA256SUMS に列挙される。
# artifacts: binary は、archives の binary 形式が作る配布名付きのバイナリを、ビルドしたバイナリより優先して対象にする。
# documents の既定値はファイル名に goamd64 などの変種を加えるため、配布名から作るよう明示する。
# Syft に渡る $artifact は dist/ からのビルド先の相対パスのため、SBOM が記述する対象の名前は --source-name で配布名にする。
# 既定の引数の --enrich all は、ライセンスなどの情報をネットワークから取得するため外し、バイナリの中身だけから作る
sboms:
  - id: binary
    artifacts: binary
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    cmd: syft
    args:
      - $artifact
      - --source-name
      - "{{ .ArtifactName }}"
      - --output
      - spdx-json=$document
    env:
      - SYFT_CHECK_FOR_APP_UPDATE=false

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

changelog:
  disable: true
