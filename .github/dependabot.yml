version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  # ビルドに使わない Dockerfile の FROM で固定した、コンテナイメージのベースイメージの digest を更新する
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
